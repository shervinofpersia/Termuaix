<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHΞN™ Termuaix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://v1.fontapi.ir/css/Vazir');
        body { 
            font-family: 'Vazir', sans-serif; 
            background-color: #030303;
            /* یه هاله نوری محو در پس‌زمینه برای اینکه افکت شیشه‌ای دیده بشه */
            background-image: radial-gradient(circle at 50% 30%, #1a0800 0%, #030303 70%);
            background-attachment: fixed;
            margin: 0;
            overflow: hidden; /* جلوگیری از اسکرول کل صفحه */
        }
        .chat-msg { 
            white-space: pre-wrap; 
            word-break: break-word; 
        }
        /* اسکرول‌بار حرفه‌ای‌تر و ظریف‌تر */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 85, 0, 0.4);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 85, 0, 0.8);
        }
        .neon-glow {
            text-shadow: 0 0 12px rgba(255, 85, 0, 0.7);
        }
        .neon-border {
            box-shadow: 0 0 20px rgba(255, 85, 0, 0.1);
        }
    </style>
</head>
<body class="h-screen w-full flex justify-center items-center sm:p-6">

    <div class="w-full h-full sm:max-w-md sm:h-[95%] bg-[#0a0a0a]/60 backdrop-blur-2xl sm:rounded-3xl shadow-2xl flex flex-col relative border-0 sm:border border-gray-800/50 neon-border overflow-hidden">
        
        <div class="bg-black/30 backdrop-blur-md border-b border-gray-800/50 p-4 text-center font-bold text-lg text-[#ff5500] neon-glow tracking-widest z-20 relative">
            ☬SHΞN™ Termuaix
        </div>

        <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-5 relative z-10 scroll-smooth">
            </div>

        <div class="bg-black/40 backdrop-blur-md border-t border-gray-800/50 p-3 sm:p-4 z-20 relative">
            <div class="flex flex-row items-center gap-3" dir="ltr">
                <input type="text" id="user-input" 
                       class="flex-1 bg-white/5 border border-gray-700/50 rounded-2xl px-5 py-3.5 text-white text-right focus:outline-none focus:border-[#ff5500]/70 focus:bg-white/10 transition-all placeholder-gray-500 shadow-inner" 
                       placeholder="..." 
                       onkeypress="if(event.key === 'Enter') sendMessage()">
                
                <button onclick="sendMessage()" 
                        class="flex items-center justify-center w-14 h-14 rounded-2xl border-2 border-[#ff5500]/80 text-[#ff5500] hover:bg-[#ff5500]/10 hover:border-[#ff5500] transition-all active:scale-90 group shadow-[0_0_10px_rgba(255,85,0,0.1)] hover:shadow-[0_0_15px_rgba(255,85,0,0.3)]">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6 transform -translate-x-0.5 group-hover:translate-x-0.5 -rotate-45 transition-transform duration-300">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="bg-black/50 backdrop-blur-md py-2.5 text-center z-20 relative border-t border-gray-900/50">
            <a href="https://t.me/shervini" target="_blank" 
               class="text-[11px] text-gray-500 hover:text-[#ff5500] transition-colors tracking-[0.2em] font-mono">
                ☬Exclusive SHΞN™ made
            </a>
        </div>
    </div>

    <script>
        window.onload = function() {
            appendMessage("Hi , im SHΞN™ai wassup !?", false);
        };

        function appendMessage(text, isUser, id = null) {
            const chatBox = document.getElementById('chat-box');
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full ${isUser ? 'justify-end' : 'justify-start'}`;
            if (id) wrapper.id = id;
            
            const div = document.createElement('div');
            div.setAttribute('dir', 'auto'); 
            
            if (isUser) {
                // بالب کاربر: ترنسپرنت با تناژ نارنجی و سایه
                div.className = "bg-[#ff5500]/10 border border-[#ff5500]/20 backdrop-blur-md text-gray-100 px-5 py-3.5 rounded-3xl rounded-br-sm max-w-[85%] chat-msg shadow-[0_8px_20px_rgba(0,0,0,0.2)] text-right";
            } else {
                // بالب هوش مصنوعی: ترنسپرنت شیشه‌ای با تناژ طوسی
                div.className = "bg-white/5 border border-white/10 backdrop-blur-md text-gray-200 px-5 py-3.5 rounded-3xl rounded-bl-sm max-w-[85%] chat-msg shadow-[0_8px_20px_rgba(0,0,0,0.2)] text-left leading-relaxed";
            }
            
            div.textContent = text;
            wrapper.appendChild(div);
            chatBox.appendChild(wrapper);
            
            // اسکرول نرم به پایین‌ترین نقطه
            setTimeout(() => {
                chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
            }, 50);
            
            return div;
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (!message) return;
            
            appendMessage(message, true);
            input.value = '';
            
            const loadingId = 'loading-' + Date.now();
            const loadingDiv = appendMessage('☬SHΞN™ core process...', false, loadingId);
            loadingDiv.classList.add('animate-pulse', 'text-[#ff5500]', 'font-mono', 'neon-glow', 'border-[#ff5500]/30');
            loadingDiv.classList.replace('bg-white/5', 'bg-[#ff5500]/5');
            
            try {
                const encodedText = encodeURIComponent(message);
                const url = `https://text.pollinations.ai/${encodedText}`;
                const response = await fetch(url);
                
                const loadEl = document.getElementById(loadingId);
                if (loadEl) loadEl.remove();
                
                if (response.ok) {
                    const data = await response.text();
                    appendMessage(data, false);
                } else {
                    const errDiv = appendMessage(`CORE ERROR: ${response.status}`, false);
                    errDiv.classList.replace('bg-white/5', 'bg-red-900/20');
                    errDiv.classList.replace('border-white/10', 'border-red-500/30');
                    errDiv.classList.add('text-red-400');
                }
            } catch (error) {
                const loadEl = document.getElementById(loadingId);
                if (loadEl) loadEl.remove();
                const errDiv = appendMessage('NETWORK TIMEOUT / PROXIED', false);
                errDiv.classList.replace('bg-white/5', 'bg-red-900/20');
                errDiv.classList.replace('border-white/10', 'border-red-500/30');
                errDiv.classList.add('text-red-400');
            }
        }
    </script>
</body>
</html>
