<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termuaix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://v1.fontapi.ir/css/Vazir');
        body { font-family: 'Vazir', sans-serif; }
        .chat-msg { white-space: pre-wrap; word-break: break-word; }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-md bg-gray-800 rounded-xl shadow-lg flex flex-col h-full overflow-hidden border border-gray-700">
        <div class="bg-indigo-600 p-4 text-center font-bold text-xl">
            هوش مصنوعی (Termuaix)
        </div>

        <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4"></div>

        <div class="p-4 bg-gray-700 flex gap-2">
            <input type="text" id="user-input" class="flex-1 bg-gray-600 rounded-lg px-4 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="چیزی بپرس..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg font-bold transition">ارسال</button>
        </div>
    </div>

    <script>
        function appendMessage(text, isUser, id = null) {
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div');
            if (id) div.id = id;
            
            if (isUser) {
                div.className = "bg-indigo-600 ml-auto p-3 rounded-l-xl rounded-tr-xl w-3/4 chat-msg";
            } else {
                div.className = "bg-gray-600 mr-auto p-3 rounded-r-xl rounded-tl-xl w-3/4 chat-msg";
            }
            
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (!message) return;
            
            // نمایش پیام کاربر
            appendMessage(message, true);
            input.value = '';
            
            // نمایش حالت در حال پردازش
            const loadingId = 'loading-' + Date.now();
            const loadingDiv = appendMessage('در حال پردازش...', false, loadingId);
            loadingDiv.classList.add('animate-pulse', 'text-gray-400');
            
            try {
                // ارسال مستقیم و بدون واسطه از مرورگر به Pollinations
                const encodedText = encodeURIComponent(message);
                const url = `https://text.pollinations.ai/${encodedText}`;
                const response = await fetch(url);
                
                // حذف المان لودینگ
                const loadEl = document.getElementById(loadingId);
                if (loadEl) loadEl.remove();
                
                if (response.ok) {
                    const data = await response.text();
                    appendMessage(data, false);
                } else {
                    const errDiv = appendMessage(`خطای درگاه: ${response.status}`, false);
                    errDiv.classList.replace('bg-gray-600', 'bg-red-600');
                }
            } catch (error) {
                const loadEl = document.getElementById(loadingId);
                if (loadEl) loadEl.remove();
                const errDiv = appendMessage('خطا در ارتباط با سرور!', false);
                errDiv.classList.replace('bg-gray-600', 'bg-red-600');
            }
        }
    </script>
</body>
</html>
